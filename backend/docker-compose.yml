services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: speakeasy
      POSTGRES_PASSWORD: speakeasy
      POSTGRES_DB: speakeasy
    ports:
      - "5432:5432"
    volumes:
      - speakeasy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakeasy -d speakeasy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://speakeasy:speakeasy@db:5432/speakeasy
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  speakeasy_pg:
